name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        eslint-version: [9, 10]
    name: Test (ESLint ${{ matrix.eslint-version }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Install ESLint ${{ matrix.eslint-version }}
        if: matrix.eslint-version == 9
        run: yarn add --dev eslint@^9.0.0 --ignore-engines

      - run: yarn lint

      - run: yarn test

      - run: yarn build

  test:
    needs: test-matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix result
        run: |
          if [[ "${{ needs.test-matrix.result }}" == "success" ]]; then
            exit 0
          else
            echo "Matrix jobs did not all pass: ${{ needs.test-matrix.result }}"
            exit 1
          fi

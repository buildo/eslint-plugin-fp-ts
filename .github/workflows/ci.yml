name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        eslint-version: [9, 10]
    name: Test (ESLint ${{ matrix.eslint-version }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Install ESLint ${{ matrix.eslint-version }}
        if: matrix.eslint-version == 9
        run: yarn add --dev eslint@^9.0.0 --ignore-engines

      - run: yarn lint

      - run: yarn test

      - run: yarn build
